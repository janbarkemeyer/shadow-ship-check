[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-ship-check"
version = "0.2.3"
description = "Inspect AIS identity changes and tracks around reported subsea cable incidents in Taiwan and the Baltic Sea."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jan Barkemeyer" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://janbarkemeyer.github.io/shadow-ship-check/"
Source = "https://github.com/janbarkemeyer/shadow-ship-check"

[project.scripts]
ssc = "shadow_ship_check.cli:main"

[tool.setuptools]
packages = ["shadow_ship_check", "shadow_ship_check._data"]
package-dir = { shadow_ship_check = "src/shadow_ship_check", "shadow_ship_check._data" = "data" }

[tool.setuptools.package-data]
"shadow_ship_check._data" = ["README.md", "fixtures/*.json", "cables/*.geojson", "eval/*.gz", "sanctions/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_site.py" = ["E501"]  # HTML templates
