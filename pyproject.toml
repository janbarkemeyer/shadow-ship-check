[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-ship-check"
version = "0.2.0"
description = "Check ships for the camouflage patterns (identity changes, flag hopping, borrowed MMSIs, slow cable crossings) seen before subsea cable incidents in Taiwan and the Baltic Sea."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
ssc = "shadow_ship_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_site.py" = ["E501"]  # HTML templates
